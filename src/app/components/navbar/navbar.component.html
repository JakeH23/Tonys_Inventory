<div class="app-shell">
    <mat-toolbar class="navbar-color mat-elevation-z8 p-0">
        <div class="nav-brand">
            <a routerLink="/" class="nav-image-link nav-image-link-desktop" aria-label="Tony's Inventory home">
                <img class="nav-image-header" src="../../../assets/toolbar-header.jpg" alt="Tony's Inventory home" />
            </a>
        </div>

        <div class="nav-actions">
            <button mat-button routerLink="/" routerLinkActive="selected no-border txt-bold" class="custom-button">
                <mat-icon>home</mat-icon>
                <span>Home</span>
            </button>
            <button mat-button routerLink="/cars" routerLinkActive="selected no-border txt-bold" class="custom-button">
                <mat-icon>directions_car</mat-icon>
                <span>Cars</span>
            </button>
            <button mat-button routerLink="/gallery" routerLinkActive="selected no-border txt-bold" class="custom-button">
                <mat-icon>image</mat-icon>
                <span>Gallery</span>
            </button>
            <button mat-button routerLink="/parts" routerLinkActive="selected no-border txt-bold" class="custom-button">
                <mat-icon>build</mat-icon>
                <span>Parts</span>
            </button>
            <button mat-button routerLink="/valuation-review" routerLinkActive="selected no-border txt-bold" class="custom-button">
                <mat-icon>manage_search</mat-icon>
                <span>Valuation Review</span>
            </button>
        </div>

        <div class="nav-quick-actions">
            <button mat-raised-button class="custom-button" (click)="openAddCarForm()">Add car</button>
            <button mat-raised-button class="custom-button" (click)="openAddPartForm()">Add part</button>
        </div>

        <div class="nav-mobile-menu">
            <button mat-icon-button [matMenuTriggerFor]="mobileNavMenu" aria-label="Open navigation menu">
                <mat-icon>menu</mat-icon>
            </button>
        </div>

        <mat-menu #mobileNavMenu="matMenu" class="mobile-nav-menu">
            <button mat-menu-item routerLink="/">
                <mat-icon>home</mat-icon>
                <span>Home</span>
            </button>
            <button mat-menu-item routerLink="/cars">
                <mat-icon>directions_car</mat-icon>
                <span>Cars</span>
            </button>
            <button mat-menu-item routerLink="/gallery">
                <mat-icon>image</mat-icon>
                <span>Gallery</span>
            </button>
            <button mat-menu-item routerLink="/parts">
                <mat-icon>build</mat-icon>
                <span>Parts</span>
            </button>
            <button mat-menu-item routerLink="/valuation-review">
                <mat-icon>manage_search</mat-icon>
                <span>Valuation Review</span>
            </button>
            <button mat-menu-item (click)="openAddCarForm()">
                <mat-icon>add_circle</mat-icon>
                <span>Add car</span>
            </button>
            <button mat-menu-item (click)="openAddPartForm()">
                <mat-icon>add_box</mat-icon>
                <span>Add part</span>
            </button>
        </mat-menu>
    </mat-toolbar>

    <div class="page-content">
        <router-outlet></router-outlet>
    </div>
</div>
